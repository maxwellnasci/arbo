name: Supabase Keep-Alive

on:
  schedule:
    # Diário às 12:00 UTC (09:00 BRT) — pausa do free tier ocorre após 7 dias sem atividade
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (Auth + query real no banco)
        env:
          SUPABASE_URL: https://jhfkflnixzivuichmkie.supabase.co
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$ANON_KEY" ]; then
            echo "::error::Secret SUPABASE_ANON_KEY não configurada."
            exit 1
          fi

          AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 --retry 2 \
            -H "apikey: $ANON_KEY" \
            "$SUPABASE_URL/auth/v1/health")

          # RPC keepalive força conexão real ao Postgres (conta como atividade
          # para o detector de pausa do free tier).
          DB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 --retry 2 \
            -X POST \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "Content-Type: application/json" \
            "$SUPABASE_URL/rest/v1/rpc/keepalive")

          echo "Auth health:   HTTP $AUTH_STATUS"
          echo "Keepalive RPC: HTTP $DB_STATUS"

          if [ "$AUTH_STATUS" != "200" ]; then
            echo "::error::Auth health check falhou com HTTP $AUTH_STATUS"
            exit 1
          fi

          if [ "$DB_STATUS" != "200" ]; then
            echo "::error::Keepalive RPC falhou com HTTP $DB_STATUS (esperado 200). Verifique se a migration foi aplicada no Supabase."
            exit 1
          fi
